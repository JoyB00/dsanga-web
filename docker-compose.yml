# Optional: run Postgres in Docker instead of a local install.
#   docker compose up -d postgres
# then set DATABASE_URL=postgres://postgres:postgres@localhost:5432/dsanga
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dsanga
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
